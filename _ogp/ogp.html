<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>iLab OGP画像（1200×630）</title>
<!-- この画面を 1200×630 で撮影したものが ../assets/ogp.png。作り直し方は README.md を参照 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@800&family=Noto+Sans+JP:wght@700;800&display=block" rel="stylesheet">
<style>
  :root { --ink: #17202f; --sky: #2a86d9; --sky-text: #1d6bb5; --cell: 112px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #fff; color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; letter-spacing: .03em; }

  /* 背景の周期表。右側の空きマスに大きな iL を置く */
  .ptable { position: absolute; display: grid; grid-template-columns: repeat(8, var(--cell)); grid-auto-rows: var(--cell); right: -400px; top: -26px; }
  .c { margin: 0 -1px -1px 0; border: 1px solid #e3e9f1; display: grid; place-items: center; position: relative; font-family: Inter, sans-serif; color: #d6dee8; }
  .c b { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .c i { position: absolute; top: 7px; left: 9px; font-style: normal; font-size: 13px; font-weight: 800; }
  .c.blank { border-color: transparent; }
  .il { border: 4px solid var(--sky); background: #fff; color: var(--sky); box-shadow: 0 18px 40px -18px rgba(42,134,217,.7); z-index: 2; border-radius: 6px; }
  .il b { font-family: "Cormorant Garamond", serif; font-size: 66px; font-weight: 700; letter-spacing: -.01em; margin-top: -6px; }

  /* 左の文字が読みやすいように白くぼかす */
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #fff 0%, #fff 52%, rgba(255,255,255,.6) 62%, rgba(255,255,255,0) 72%); }

  .text { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 720px; }
  .badge { display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: #4a5466; }
  .badge b { background: #eaf3fc; color: var(--sky-text); border-radius: 8px; padding: 4px 14px; }
  h1 { margin: 26px 0 0; font-size: 64px; font-weight: 800; line-height: 1.25; }
  h1 .logo { display: block; font-family: Inter, sans-serif; font-size: 112px; line-height: 1.05; letter-spacing: -.03em; color: var(--sky); margin-top: 6px; }
  .sub { margin: 22px 0 0; font-size: 28px; font-weight: 700; }
  .chips { display: flex; gap: 12px; margin-top: 26px; }
  .chips span { font-size: 22px; font-weight: 700; padding: 8px 18px; border-radius: 999px; color: #fff; background: linear-gradient(120deg, #1a73c4, #2f55d4); }
  .chips span.lv { background: linear-gradient(120deg, #7a5cf0, #c25fb8); }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #3ec5f0, #2f6bff 55%, #8e7cff); }
</style>
</head>
<body>
  <div class="ptable" id="ptable"></div>
  <div class="fade"></div>
  <div class="text">
    <span class="badge"><b>事前登録受付中</b>2027年春 リリース予定</span>
    <h1>理系の可能性を広げる、<span class="logo">iLab</span></h1>
    <p class="sub">理系学生だけのコミュニティアプリ</p>
    <div class="chips"><span>マッチ・トーク 男女とも無料</span><span class="lv">まずは仲間づくりから</span></div>
  </div>
  <div class="bar"></div>

<script>
  // 周期表の 1〜4周期・11〜18族あたりを切り出し、3周期の空きマスに iL を置く
  const rows = [
    ["", "", "", "", "", "", "", "He:2"],
    ["", "", "B:5", "C:6", "N:7", "O:8", "F:9", "Ne:10"],
    ["", "IL", "Al:13", "Si:14", "P:15", "S:16", "Cl:17", "Ar:18"],
    ["Cu:29", "Zn:30", "Ga:31", "Ge:32", "As:33", "Se:34", "Br:35", "Kr:36"],
    ["Ag:47", "Cd:48", "In:49", "Sn:50", "Sb:51", "Te:52", "I:53", "Xe:54"],
    ["Au:79", "Hg:80", "Tl:81", "Pb:82", "Bi:83", "Po:84", "At:85", "Rn:86"],
  ];
  document.getElementById("ptable").innerHTML = rows.flat().map((v) => {
    if (!v) return '<span class="c blank"></span>';
    if (v === "IL") return '<span class="c il"><b>iL</b></span>';
    const [sym, n] = v.split(":");
    return `<span class="c"><i>${n}</i><b>${sym}</b></span>`;
  }).join("");
</script>
</body>
</html>
